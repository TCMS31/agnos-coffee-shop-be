plugins:
  - rubocop-rails
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 2.7
  TargetRailsVersion: 6.0
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'bin/**/*'
    - 'db/schema.rb'
    - 'vendor/**/*'
    - 'tmp/**/*'
    - 'log/**/*'
    - 'node_modules/**/*'

# Rails ships its own generated boilerplate without top-level documentation
# comments; the application's own classes are documented where it matters.
Style/Documentation:
  Enabled: false

# Rails 6 still wants `.freeze` on mutable constants, but frozen_string_literal
# covers the common case.
Style/FrozenStringLiteralComment:
  Enabled: true

Layout/LineLength:
  Max: 110
  Exclude:
    - 'db/migrate/**/*'
    - 'config/initializers/**/*'

# The API is English-only and has no locale story; a subject line in the mailer
# is clearer than an indirection through config/locales.
Rails/I18nLocaleTexts:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - 'config/**/*'

Metrics/MethodLength:
  Max: 15

RSpec/ExampleLength:
  Max: 15

RSpec/MultipleExpectations:
  Max: 4

RSpec/NestedGroups:
  Max: 4

# The suite intentionally names its subject after the model under test.
RSpec/NamedSubject:
  Enabled: false
